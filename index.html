<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freaky timer</title>
    
    <link rel="stylesheet" href="./stoperstyle.css" />
    <link rel="icon" href="icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
</head>
<body>

    
    <div id="bg1" class="bg-layer"></div>
    <div id="bg2" class="bg-layer"></div>

    <div class="layout">
        <p class="header">STOPER</p>

        <div class="tdiv">
            <p class="timer" id="time"></p>
        </div>

        <div class="buttons">
            <button class="b" id="start">START</button>
            <button class="b" id="stop">STOP</button>
            <button class="b" id="reset">RESET</button>
            <button class="b" id="theme">THEME</button>
        </div>
    </div>

    <script src="stoper.js"></script>
</body>
</html>
